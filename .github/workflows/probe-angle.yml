name: Probe ANGLE package
on:
  workflow_dispatch:
  push:
    branches: ['xbox/probe']
jobs:
  probe:
    runs-on: windows-2025
    steps:
      - shell: pwsh
        run: |
          nuget install ANGLE.WindowsStore -Version 2.1.13 -OutputDirectory pkgs
          Get-ChildItem pkgs -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
          Get-Content (Get-ChildItem pkgs -Recurse -Filter gl3.h | Select-Object -First 1).FullName -TotalCount 5 -ErrorAction SilentlyContinue
          $dll = Get-ChildItem pkgs -Recurse -Filter libGLESv2.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if ($dll) { & "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" /exports $dll.FullName | Select-String 'gl[A-Z]' | Select-Object -First 400 | Out-String -Width 200 }
